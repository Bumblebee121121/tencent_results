data_root: data/TencentGR-1M
stage3_root: artifacts/stage3
stage4_root: artifacts/stage4
output_root: artifacts/stage5
log_root: logs/stage5

recall_protocol_version: stage5_recall_baseline_v2
stage3_protocol_version: click_target_prefix_v2
stage4_protocol_version: stage4_train_only_features_v1
seed: 42
scan_batch_size: 8192
recall_ks: [10, 50, 100, 500]
ndcg_ks: [10, 50, 100]

retrieval:
  # Stage 3 does not define previously seen items as invalid targets. Keep them eligible.
  exclude_history_items: false

itemcf:
  fit_window: 20
  neighbor_topn: 500
  pair_partitions: 256
  pair_buffer_size: 1000000
  experiments:
    equal_all:
      exposure_weight: 1.0
      click_weight: 1.0
      unknown_weight: 0.0
      history_limit: null
    click3_all:
      exposure_weight: 1.0
      click_weight: 3.0
      unknown_weight: 0.0
      history_limit: null
    click3_recent20:
      exposure_weight: 1.0
      click_weight: 3.0
      unknown_weight: 0.0
      history_limit: 20

two_tower:
  embedding_dim: 64
  batch_size: 2048
  random_negatives: 20
  # Total epoch ceiling. Use --resume to continue an existing best checkpoint.
  max_epochs: 12
  early_stopping_patience: 2
  early_stopping_min_delta: 0.002
  # Save the 3.67 GB model+SparseAdam resume state periodically, not after every best epoch.
  resume_checkpoint_interval: 3
  learning_rate: 0.01
  max_history_length: null
  num_workers: 0
  # Ragged histories make pinned host-memory staging unnecessary and avoid allocator retention.
  pin_memory: false
  # null scans the complete Validation Primary split; the collator keeps Train-Seen targets only.
  validation_max_samples: null

faiss:
  index_type: hnsw_flat_ip
  M: 32
  efConstruction: 200
  efSearch: 512
  embedding_batch_size: 16384
  query_batch_size: 2048

hnsw_accuracy_audit:
  split: validation_primary
  sample_size: 1000
  ks: [10, 50, 100, 500]
  minimum_mean_recall:
    10: 0.95
    50: 0.95
    100: 0.95
    500: 0.90

debug:
  max_users: 1000
  max_train_samples: 10000
  max_eval_samples: 1000
  epochs: 1
  pair_buffer_size: 50000
  repeated_target_max_samples: 10000
  hnsw_audit_samples: 100
